<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Build the habit that transforms your skin in just 21 days. Vaseline Gluta-Hya Serum-Infused Body Lotion — 5 variants, real results." />
  <title>Vaseline Gluta-Hya | 21 Day Glow Challenge</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #f0f1f6; overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    @keyframes orbFloat1 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(30px, -40px) scale(1.08); } }
    @keyframes orbFloat2 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-25px, 35px) scale(1.05); } }
    @keyframes orbFloat3 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(20px, -20px) scale(1.1); } }
    @keyframes bottleFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-14px); } }
    @keyframes ringPulse { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.03); } }
    @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-33.33%); } }
    @keyframes expandIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }

    /* Hamburger — hidden on desktop, shown on mobile */
    .nav-hamburger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 6px;
      border-radius: 8px;
    }
    .nav-hamburger span {
      display: block;
      width: 22px;
      height: 2px;
      background: #17181f;
      border-radius: 2px;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    @media (max-width: 768px) {
      .nav-links { display: none !important; }
      .nav-hamburger { display: flex !important; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f0f1f6; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    window.TWEAK_DEFAULTS = { simulateDay: 0 };
  </script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Content.jsx"></script>
  <script type="text/babel" src="Challenge.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>
</body>
</html>

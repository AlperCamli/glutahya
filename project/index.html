  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #f0f1f6; overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    @keyframes orbFloat1 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(30px, -40px) scale(1.08); } }
    @keyframes orbFloat2 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-25px, 35px) scale(1.05); } }
    @keyframes orbFloat3 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(20px, -20px) scale(1.1); } }
    @keyframes bottleFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-14px); } }
    @keyframes ringPulse { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.03); } }
    @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-33.33%); } }
    @keyframes expandIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Nav mobile */
    @media (max-width: 768px) {
      .nav-links { display: none !important; }
    }

    /* Responsive grids */
    @media (max-width: 900px) {
      .hero-grid { grid-template-columns: 1fr !important; }
      .hero-product { display: none !important; }
      .why-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
      .signals-grid { grid-template-columns: 1fr 1fr !important; }
      .before-after { grid-template-columns: 1fr !important; gap: 24px !important; }
      .quotes-grid { grid-template-columns: 1fr !important; }
      .products-grid { grid-template-columns: 1fr !important; }
      .combo-inner { grid-template-columns: 1fr !important; }
      .challenge-grid { grid-template-columns: 1fr !important; }
      .howto-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
      .social-grid { grid-template-columns: 1fr 1fr !important; }
      .ring-col { display: none !important; }
      .badges-col { display: none !important; }
    }
    @media (max-width: 560px) {
      .social-grid { grid-template-columns: 1fr !important; }
      .signals-grid { grid-template-columns: 1fr !important; }
      .stats-row { flex-direction: column !important; }
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f0f1f6; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 3px; }
  </style>
